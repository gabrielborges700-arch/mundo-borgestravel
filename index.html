<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Borgestrável — O Reino das Super Estruturas</title>
  <meta name="description" content="Aventura pedagógica pelos 7 reinos da engenharia estrutural: forças, materiais, análise e a Grande Aliança Estrutural.">
  <!-- Ícone da aba (rosa dos ventos dourada) e ícone de "Adicionar à tela inicial" do iPhone.
       Caminhos relativos: funcionam no file:// e na subpasta do GitHub Pages -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Cor da barra do navegador no celular (mesma madeira escura da barra de navegação) -->
  <meta name="theme-color" content="#3a2412">

  <!-- Prévia ao compartilhar o link (WhatsApp, Telegram, Discord, Facebook, X...).
       og:image PRECISA de URL absoluta: os robôs das redes não resolvem caminho relativo -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Mundo Borgestrável">
  <meta property="og:title" content="Mundo Borgestrável — O Reino das Super Estruturas">
  <meta property="og:description" content="Explore os 7 reinos da engenharia, conquiste runas e descubra por que pontes, torres e castelos não caem! Uma aventura medieval para jovens engenheiros.">
  <meta property="og:url" content="https://gabrielborges700-arch.github.io/mundo-borgestravel/">
  <meta property="og:image" content="https://gabrielborges700-arch.github.io/mundo-borgestravel/imagens/og-borgestravel.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Rosa dos ventos dourada cercada pelas gemas dos 7 reinos, ao lado do título Mundo Borgestrável — O Reino das Super Estruturas">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mundo Borgestrável — O Reino das Super Estruturas">
  <meta name="twitter:description" content="Explore os 7 reinos da engenharia, conquiste runas e descubra por que pontes, torres e castelos não caem!">
  <meta name="twitter:image" content="https://gabrielborges700-arch.github.io/mundo-borgestravel/imagens/og-borgestravel.png">
  <meta name="twitter:image:alt" content="Rosa dos ventos dourada cercada pelas gemas dos 7 reinos, ao lado do título Mundo Borgestrável">
  <!-- ?fr=17 força navegadores a buscarem a versão nova após cada grande atualização -->
  <!-- Fontes do Google sem travar a página (antes: @import no style.css, que bloqueava tudo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&amp;family=Cinzel:wght@400;700&amp;family=MedievalSharp&amp;display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&amp;family=Cinzel:wght@400;700&amp;family=MedievalSharp&amp;display=swap"></noscript>
  <link rel="stylesheet" href="style.css?fr=17">
  <!-- Redesign "pergaminho", etapa 1 (cores e letras): vem DEPOIS do style.css pra ganhar dele. Tirar esta linha desfaz a etapa -->
  <link rel="stylesheet" href="estilos/pergaminho-1-cores-fontes.css?fr=17">
  <!-- Redesign "pergaminho", etapa 2 (molduras e ornamentos): vem DEPOIS da etapa 1. Tirar esta linha desfaz a etapa -->
  <link rel="stylesheet" href="estilos/pergaminho-2-molduras.css?fr=17">
  <link rel="stylesheet" href="estilos/pergaminho-3-animacoes.css?fr=17">
</head>
<body>

  <!-- Link de acessibilidade: pula direto pro conteúdo principal -->
  <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo</a>

  <!-- Fundo mágico fixo: céu, estrelas e lua (populado via JS em efeitos.js na Fase 3) -->
  <div class="fundo-magico-fixo" id="fundo-magico" aria-hidden="true"></div>

  <!-- ===================== CABEÇALHO ===================== -->
  <!-- Estilos do hero ficam na seção 18 do style.css (classes .hero-*) -->
  <header class="moldura-gotica hero-principal">

    <!-- Fundo de vitral (só CSS, sem imagem externa) -->
    <div class="vitral-hero-fundo"></div>

    <!-- Brasão central com anel metálico girando -->
    <div class="hero-emblema-container">
      <div class="anel-metalico hero-anel"></div>
      <div class="hero-emblema-nucleo">
        <span id="brasao-avatar" title="Nível 1: Aprendiz de Pedra">🪨</span>
      </div>
    </div>

    <div class="divisor-losango hero-divisor"><span>❖</span></div>

    <span class="font-gotico hero-kicker">
      Crônica de Engenharia
    </span>

    <h1 class="font-display hero-titulo">
      <span class="hero-titulo-linha1">Mundo Borgestrável</span>
      <span class="hero-titulo-linha2">O REINO DAS SUPER ESTRUTURAS</span>
    </h1>

    <div class="divisor-losango hero-divisor"><span>❖</span></div>

    <p class="font-serif-body hero-subtitulo">
      Forje seu conhecimento nas forjas antigas dos Mestres Construtores
    </p>

    <!-- Abre a Crônica Fundadora (cronica.js) — continua do último capítulo lido -->
    <div class="hero-acoes">
      <button type="button" id="botao-cronica-hero" class="btn-gotico hero-botao-cronica"
        data-abrir-cronica="" aria-label="Abrir a Crônica do Reino, o livro de história do Império"
        title="Ler a Crônica Fundadora do Império">📜 Crônica do Reino</button>
    </div>
  </header>

  <!-- ===================== CONTEÚDO PRINCIPAL ===================== -->
  <!-- Estilos do main ficam na seção 20 do style.css (#conteudo-principal) -->
  <main id="conteudo-principal">

    <!-- Aqui entram os 7 blocos e as 45 runas, renderizados dinamicamente pelo app.js na Fase 4 -->
    <section id="lista-blocos" aria-label="Blocos do reino">
      <!-- Placeholder temporário — será substituído por app.js -->
      <p class="font-body" style="text-align:center; color: var(--pergaminho-escuro);">
        Carregando o mapa do reino...
      </p>
    </section>

    <!-- Galeria de conquistas — populada dinamicamente pelo jogo.js -->
    <section id="galeria-conquistas" aria-label="Conquistas" style="margin-top:2.5rem;"></section>

  </main>

  <!-- ===================== RODAPÉ ===================== -->
  <!-- O padding fica no style.css (seção 19b): no celular ele reserva o espaço dos botões flutuantes -->
  <footer style="position: relative; z-index: 10; text-align: center; color: var(--pergaminho-escuro); font-size: 0.85rem;">
    <div class="divisor-rune" style="max-width: 300px; margin: 0 auto 1rem;"></div>
    Mundo Borgestrável — um projeto de engenharia + didática
  </footer>

  <!-- ===================== SCRIPTS ===================== -->
  <!-- Scripts comuns (SEM type="module") — a ordem de carregamento importa:
       brasoes.js lê o dados.js; cronica.js, som.js e portal.js usam o wrapper de
       armazenamento do navegacao.js; app.js e jogo.js chamam todos eles (sempre com typeof);
       simuladores-polimento.js vem logo depois do simuladores.js (encadeia criarPainelSimulacao);
       cadeados.js, painel-reino.js e horizonte.js vêm por último porque encadeiam funções do jogo.js -->
  <script src="dados.js?fr=17"></script>
  <script src="brasoes.js?fr=17"></script>
  <script src="efeitos.js?fr=17"></script>
  <script src="simuladores.js?fr=17"></script>
  <script src="simuladores-polimento.js?fr=17"></script>
  <script src="oraculo.js?fr=17"></script>
  <script src="navegacao.js?fr=17"></script>
  <script src="cronica.js?fr=17"></script>
  <script src="som.js?fr=17"></script>
  <script src="portal.js?fr=17"></script>
  <script src="app.js?fr=17"></script>
  <script src="jogo.js?fr=17"></script>
  <script src="cadeados.js?fr=17"></script>
  <script src="painel-reino.js?fr=17"></script>
  <script src="horizonte.js?fr=17"></script>
  <script src="revelar.js?fr=17"></script>

</body>
</html>
